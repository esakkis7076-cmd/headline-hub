<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="pulseGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
  </defs>
  
  <!-- Pulse Icon -->
  <g transform="translate(8, 16)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#1E293B"/>
    <polyline points="8,28 14,28 18,14 22,38 26,20 30,32 34,24 40,24" 
