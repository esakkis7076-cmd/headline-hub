              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="24" r="2.5" fill="#F97316"/>
  </g>
  
  <!-- "Story" in white -->
  <text x="68" y="42" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="34" font-weight="700" letter-spacing="-0.5" fill="#F1F5F9">Story</text>
  <!-- "Pulse" in orange -->
  <text x="173" y="42" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="34" font-weight="700" letter-spacing="-0.5" fill="#F97316">Pulse</text>
  
  <!-- Tagline -->
  <text x="68" y="62" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="11" font-weight="500" letter-spacing="2.5" fill="#94A3B8">AI HEADLINE OPTIMIZER</text>
