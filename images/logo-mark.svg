<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" rx="26" fill="#0F172A"/>
  
  <!-- "S" letter stylized with pulse -->
  <text x="18" y="82" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="68" font-weight="800" fill="#F1F5F9">S</text>
  
  <!-- Pulse line cutting through -->
  <polyline points="52,68 60,68 66,48 72,85 78,58 84,72 88,62 102,62" 
            fill="none" stroke="url(#markGrad)" stroke-width="5" 
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="102" cy="62" r="4" fill="#F97316"/>
</svg>
