<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="ogPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#F97316;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#94A3B8" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#94A3B8" stroke-width="1"/>
  </g>
  
  <!-- Large decorative pulse line in background -->
  <polyline points="0,420 100,420 200,420 280,280 360,500 440,340 520,400 600,370 700,370 1200,370" 
            fill="none" stroke="url(#glowGrad)" stroke-width="80" 
            stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  
  <!-- Accent pulse line -->
  <polyline points="0,400 100,400 200,400 280,280 360,480 440,340 520,390 600,360 700,360 800,360" 
            fill="none" stroke="url(#ogPulseGrad)" stroke-width="4" 
            stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  
  <!-- Logo icon top-left -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="52" height="52" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <polyline points="9,30 15,30 19,16 23,40 27,22 31,34 35,26 43,26" 
              fill="none" stroke="url(#ogPulseGrad)" stroke-width="3" 
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="43" cy="26" r="3" fill="#F97316"/>
  </g>
  
  <!-- "STORY PULSE" text next to icon -->
  <text x="145" y="100" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="22" font-weight="700" letter-spacing="3" fill="#94A3B8">STORY PULSE</text>
  
  <!-- Main headline -->
  <text x="80" y="220" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="56" font-weight="800" fill="#F1F5F9">Smarter headlines.</text>
  <text x="80" y="290" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="56" font-weight="800" fill="#F97316">9 Indian languages.</text>
  
  <!-- Sub text -->
  <text x="80" y="345" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="22" font-weight="400" fill="#94A3B8">AI-generated headlines for Search, Social &amp; WhatsApp. Zero integration.</text>
  
  <!-- Language scripts at bottom -->
  <text x="80" y="530" font-family="'Noto Sans Devanagari', 'Noto Sans Tamil', system-ui, sans-serif" 
        font-size="24" font-weight="500" fill="#64748B">
    हिन्दी · தமிழ் · తెలుగు · ಕನ್ನಡ · বাংলা · मराठी · മലയാളം · ગુજરાતી · English
  </text>
  
  <!-- URL bottom right -->
  <text x="1120" y="590" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="18" font-weight="600" fill="#F97316" text-anchor="end">storypulse.co</text>
</svg>
