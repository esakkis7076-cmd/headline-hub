<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="#0F172A"/>
  
  <!-- Pulse/heartbeat line -->
  <polyline points="72,290 140,290 185,130 235,400 285,200 330,330 370,255 440,255" 
            fill="none" stroke="url(#favGrad)" stroke-width="32" 
            stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing dot at the end -->
  <circle cx="440" cy="255" r="22" fill="#F97316"/>
  <circle cx="440" cy="255" r="36" fill="#F97316" opacity="0.2"/>
</svg>
